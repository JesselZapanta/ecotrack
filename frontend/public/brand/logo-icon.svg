<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="EcoTrack TCGC logo: a waste bin partly filled, with a check mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EcoTrack TCGC</title>
  <defs>
    <clipPath id="body"><path d="M52 80H204L192 216Q191 228 179 228H77Q65 228 64 216Z"/></clipPath>
    <clipPath id="lid"><rect x="40" y="48" width="176" height="24" rx="7"/></clipPath>
  </defs>
  <!-- handle -->
  <rect x="106" y="34" width="44" height="14" rx="5" fill="#17201D"/>
  <!-- lid: four category colors -->
  <g clip-path="url(#lid)">
    <rect x="40"  y="48" width="42" height="24" fill="#2E7D4F"/>
    <rect x="84"  y="48" width="42" height="24" fill="#E3A908"/>
    <rect x="130" y="48" width="42" height="24" fill="#2A2D2B"/>
    <rect x="174" y="48" width="42" height="24" fill="#D4531A"/>
  </g>
  <!-- bin fill (collection progress) -->
  <g clip-path="url(#body)">
    <rect x="40" y="142" width="176" height="96" fill="#1C4E6E"/>
  </g>
  <!-- ribs -->
  <g stroke="#1C4E6E" stroke-opacity=".28" stroke-width="6" stroke-linecap="round">
    <line x1="96"  y1="94" x2="98"  y2="126"/>
    <line x1="128" y1="94" x2="128" y2="126"/>
    <line x1="160" y1="94" x2="158" y2="126"/>
  </g>
  <!-- bin outline -->
  <path d="M52 80H204L192 216Q191 228 179 228H77Q65 228 64 216Z" fill="none" stroke="#1C4E6E" stroke-width="8" stroke-linejoin="round"/>
  <!-- check -->
  <path d="M102 186L121 204L156 163" fill="none" stroke="#F6F7F4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
